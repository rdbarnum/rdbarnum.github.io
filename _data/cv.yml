        - title: PTTGCA US Petrochemical Project
          role: Individual Contributor
          year: NOV 2015 - APR 2016
          description_list:
          - The FEED scope of this project was to the engineering design development of off-sites and utilities systems for the PTTGCA US Petrochemical Complex project.
          - Responsible for primary process definition and simulation, PFD development, and equipment sizing for the cooling water system and ethylene boil off gas system.
          - Participated in plant wide HAZOP review.
        
        - title: Wheatstone LNG Project
          role: Individual Contributor, Study Lead (MDMT Analysis)
          year: JUN 2015 - OCT 2015
          description_list:
          - The EPC scope of this project consisted of engineering design development for a gas processing facility containing two (2) train liquefied natural gas (LNG) production and one train of domestic gas production. The facility was designed with a total LNG production capacity of 8.9 million tonnes per annum (MTPA) and a domestic gas production capacity of 220 million standard cubic feet per day (MMscfd). The liquefaction portion of this facility was designed using the ConocoPhillips Optimized Cascade Process.
          - Led plant wide minimum design metal temperature (MDMT) analysis select carbon steel systems; trained team in calculation methodology, analyzed plant equipment and recommend equipment for review to management and client, reviewed all calculations for correctness, and recommended further analysis requirements to management.
          - Audited existing plant process set points for technical correctness and provided recommendations for modification to management.

        - title: Angola LNG Project
          role: Individual Contributor, Study Lead (MDMT Analysis)
          year: JAN 2014 - JUN 2015
          description_list:
          - The EPC scope of this project consisted of design development for a one (1) train LNG facility with a total of 5.20 MTPA LNG production capacity. The facility design employed the ConocoPhillips Optimized Cascade process.
          - Performed analysis on acid gas removal unit for turndown operation.
          - Participated in the development of a hydrocarbon dew point control system, including proposal study preparation, PFD development, H&MB development, equipment design and specification, pressure relief valve and depressing valve specification, HAZOP review, and alarm rationalization.
          - Performed plant wide equipment minimum design metal temperature (MDMT) analysis.
        
        - title: Junior Process Engineering Group Coordinator
          role: Group Coordinator
          year: MAY 2012 - DEC 2013
          description_list:
          - Responsible for organizing grade level oriented presentations, hands on training activates, vendor presentations, and other activates for the Junior Process Engineering Group.
          - Goals included career development, industry awareness, and improvement of technical ability for the 20+ junior engineering professionals in the group.

        - title: Mozambique LNG Project
          role: Individual Contributor
          year: NOV 2012 - DEC 2013
          description_list:
          - The FEED scope for this project was to develop a Liquefied Natural Gas (LNG) facility consisting of two (2) trains, with each train having an LNG production capacity of 5.37 MTPA. The ConocoPhillips Optimized Cascade process was used in the design of this facility.
          - Responsible for development of process flow diagrams (PFDs). 
          - Performed statistical analysis of meteorological data to define plant ambient conditions.
          - Assisted in the development of the process engineering design basis.
          - Coordinated with acid gas removal unit licensor to analyze various feed gas cases and prepare preliminary heat and material balances.
          - Sized the flare system and associated equipment. 
          - Performed equipment sizing for various vessels and other equipment throughout the plant.
        
        - title: Gladstone LNG Project
          role: Individual Contributor
          year: SEP 2011 - OCT 2012
          description_list:
          - The EPC scope for this project was to develop a two (2) train Liquefied Natural Gas (LNG) facility with 3.4 MTPA of LNG production capacity per train. The facility was designed using the ConocoPhillips Optimized Cascade process
          - Responsible for maintenance of process flow diagrams (PFDs) and process safety schematics.
          - Involved in cross project review of front end gas treatment units, including the acid gas removal unit, discussing design improvements, project issues, and overall project status.
          - Involved in design review of P&IDs, line designation tables, design temperature and pressure diagrams, cause and effect diagrams.
          - Performed design temperature and pressure calculations for all utilities units.
          - Wrote interlock and shutdown specifications for the plant.
          - Updated various deliverables, calculations, and specifications as required.

        - title: Sabine Pass Liquefaction Project
          role: Individual Contributor
          year: JUN 2011 - AUG 2011
          description_list:
