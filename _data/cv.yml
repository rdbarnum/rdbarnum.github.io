    - title: Principal Chemical Engineer
      institution: <a href="https://www.ceciliamaterials.com/">Cecilia Materials, Inc.</a>
      year: SEP 2023 - NOW
      description: 
        - Responsible for process engineering design development of a novel system which converts waste plastic to energy and performance materials. 
        - Directed scale up of new technology from laboratory scale to pilot plant and commercial scale facilities. Designed laboratory, pilot, demonstration, and commercial scale equipment required for technology proof of concept.  
        - Developed process flow diagrams and mass and energy balances for the novel plastic processing system at pilot, demonstration, and commercial scales.
        - Generated preliminary size and layout schematics for pilot and demonstration plant equipment. 
        - Managed third party engineering contractors responsible for developing detailed engineering design packages for several facilities with increasing processing scale.
        - Managed engineering consultants with subject matter expertise to develop a novel reactor design configuration.
      
      projects:
