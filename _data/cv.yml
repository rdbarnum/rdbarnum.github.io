    - title: Product Development Engineer - Chemical / Process
      institution: <a href="https://oilandgasseparations.pentair.com/">Pentair Filtration Solutions, LLC</a>, Conroe, TX, USA
      year: AUG 2017 - SEP 2023
      description:
        - Applied professional engineering techniques to identify, define, plan, schedule, coordinate and implement new product designs and product improvements to ensure highest level of profitability and customer satisfaction.
        - Directly led engineering projects from concept through production, and provided technical expertise and support on engineering projects of other engineers.
        - Developed budget, resource requirements, schedule, and scope for projects.
        - Completed development process documentation for new products, such as failure mode effects analysis (FMEA), design input/design output, and product validation plans, and other documentation/information for stage gate reviews.
        - Created design engineering deliverables, including system process flow diagrams (PFDs), detailed piping and instrumentation diagrams (P&IDs), chemical process simulations, and 3D CAD models / drawings.
        - Designed, built, and implemented prototypes, testing equipment, and testing procedures to collect relevant data and validate new technologies.
        - Created BOMs, part numbers, assemblies, sub-assemblies, and raw materials within ERP System for new products.
        - Interfaced with product management, applications engineering, sales, quality, and operations to ensure timely production implementation of projects.
        - Assisted manufacturing operations staff with projects for efficiency improvements in labor, space and equipment to ensure the highest level of profitability. Participated in specific engineering initiatives such as value engineering, warranty reduction efforts, or other projects as assigned.
        - Provided technical assistance and support to customer inquiries and sales efforts.
      
      projects:
        - title: Gas Phase Extraction (GPEX) Project
          role: Individual Contributor
          year: JAN 2022 - SEP 2023
          description_list:
          - GPEX technology is a novel system for solvent-based extraction of dissolved contaminants from gas product streams. This project developed the patent-pending extraction technology into a suite of several commercially deployable integrated solvent extraction systems. 
          - Investigated suitability of technology system for use with alkaline hydroxide and ethaline glycol solvent families. 
          - Prepared pilot plant skid and performed pilot plant evaluation of technology performance at customer facilities. 
          - Developed PFDs with appropriate system configuration and control instrumentation requirements each full-scale solvent system.
         
        - title: NextGen ProcessOR Project (<a href="https://oilandgasseparations.pentair.com/en/technologies/mpax.html">MPAX</a>)
          role: Project Lead
          year: DEC 2019 - SEP 2023
          description_list:
            - The goal of the NextGen ProcessOR project was to improve overall liquid filter element performance. The specified target was a 50% improvement in filter capacity, which would facilitate a 1-2 nominal size reduction in filtration pressure vessels for new capital projects.
            - Specified general performance targets by analyzing existing filter vessel sizing parameters.
            - Analyzed historical bids from the previous two years and performed a theoretical re-sizing. Compared actual sizing data to theoretical performance targets to further refine project performance requirements.
            - Brainstormed new pleating configurations to facilitate increase in available filtration surface area.
            - Researched new to purpose filtration media to improve available filtration surface area and contaminant retention capacity.
            - Specified testing protocol to quantify and validate performance improvement resulting from new pleating configurations and new filtration media compared to traditional element construction specifications.
            - Assembled and tested lab scale filter elements according to testing protocol. Analyzed experimentation data, quantified relative filter capacity and performance, and reported results to management and key project stakeholders.
        
        - title: Amine Reclamation Skid Project
          role: Project Lead
          year: MAR 2019 - NOV 2019
          description_list:
            - The scope of this project was to design a portable skid to remove heat stable amine salts from alkanolamine solvent solutions at gas processing facilities. 
            - Prepared a technology survey examining existing technologies for heat stable amine salt regeneration. Identified ion exchange resin as technology most suitable for implementation.
            - Preformed preliminary study of available ion exchange resins available for laboratory research and field testing. 
            - Performed laboratory analysis using electrical conductivity to measure salt concentration in aqueous alkanolamine solution.

        - title: <a href="https://oilandgasseparations.pentair.com/content/ift/oilandgasseparations/en/technologies/pure-pack.html">Pure Pack</a> Pilot Project
          role: Individual Contributor
          year: SEP 2017 - JUL 2019
          description_list:
            - The Pure Pack system is a portable automated filtration and oil separation system suitable for produced water and plant wastewater treatment applications. The scope of this project was to design and construct a pilot scale version of this system with integrated control system.
            - Developed P&IDs for the pilot skid using AutoCAD Plant 3D. Specified optimal control system logic, required alarms and system interlocks, and desired failure positions of actuated valves.
            - Assembled pilot skid as specified by P&ID, skid arrangement drawings, and piping/tubing isometrics. 
            - Specified requirement for relief devices for filtration tank and coalescing vessel on the skid. Coordinated relief design and sizing activities with third party process safety consultant.
            - Recommended requirement for a process hazard analysis (PHA) of the pilot system. Organized PHA activities and coordinated with third party process safety consultant.
            - Specified pressure rating requirements for low-pressure filter tank for the pilot system; determined minimum required pressure in flare header for successful relief of gas during upset scenarios requiring pressure relief; identified need for mechanical stress analysis performed by a licensed professional engineer.
        
        - title: <a href="https://oilandgasseparations.pentair.com/en/technologies/polarex.html">Polarex</a> Upgrade Project
          role: Individual Contributor
          year: MAY 2018 - APR 2019
          description_list:
            - The scope of this project was to provide support to the outside sales organization by determining the root cause of routine off-specification liquefied petroleum gas (LPG) product stream at a customer’s refining facility and develop a cost-effective solution to consistently meet product specification in the customer’s LPG product. Annual off-specification penalty could reach as high as $1,800,000, depending on customer’s LPG production rates.
            - Developed detailed pilot testing plan employing Pentair’s patented Polarex extractive separation technology. Proposed layout of pilot unit and developed detailed sample analysis plan. 
            - Conducted on-site pilot testing.
            - Analyzed pilot testing results and recommended appropriate system configuration and operating parameters to applications engineering team for use in full scale system sales proposal development.
            - Developed a technical paper based upon the findings of this project and presented the results at the AIChE 2019 Spring Meeting (see <a href="../publications">publications</a>).
        
        - title: HMEL Washable Element Project
          role: Project Lead
          year: JUN 2018 - FEB 2019
          description_list:
            - Tasked with developing a new washable filter element within strict sales price constraints. 
            - Designed and developed new low-cost element by reducing material costs and minimizing material required for construction.
            - Interfaced with suppliers to source new materials and coordinated procurement of new materials.
            - Constructed porotype elements and coordinated element design and construction review with manufacturing operations team. 
            - Provided manufacturing support to facilitate on-time delivery of new product to the customer.
        
        - title: Media Coupon Test Stand Project
          role: Project Lead
          year: SEP 2017 - DEC 2018
          description_list:
            - Tasked with the development and construction of a new test stand for evaluating filter media life and dirt holding capacity. 
            - The project scope called for a fully automated test stand that would test small media samples (25mm diameter) at a suitable flow rate (~20 ml/min) to achieve desired filtrate flux for the given media area. The new test stand offset the need to use the existing full flow test stand, which tested full size elements with a flow range of 20-60 gpm.
            - Developed test stand process flow diagram based upon laboratory management requirements. 
            - Developed 3D model of test stand in SolidWorks.
            - Developed detailed bill of materials and cost estimate for the project. 
            - Priced and sourced all required materials for test stand construction.
            - Constructed mechanical, process, and control hardware components of the test stand.
        
        - title: Takreer Washable Element Project
          role: Project Lead
          year: JAN 2018 - APR 2018
          description_list:
            - Customer was experiencing filter element endcap delamination after repeated washing and re-use of washable filter elements. Goal of this project was to mitigate endcap delamination to the extent possible. 
            - Interfaced with product management to determine root cause of delamination and investigate existing methods of delamination prevention in element design. 
            - Designed a new machined metal endcap using SolidWorks. 
            - Coordinated prototype element construction with the manufacturing operations team.

        - title: Nexcel Medal Validation Project
          role: Project Lead
          year: AUG 2017 - NOV 2017
          description_list:
            - Responsible for validating technical equivalence of an alternative filtration media source identified by the manufacturing operations team. 
            - Developed testing plan which included procedures to determine element life, dirt holding capacity, pore size distribution, chemical compatibility, and filtrate foaming tendency.
            - Delivered written report on technical findings to facility management team. Recommended the approval of new media source based on technical similarity to existing media supply.

