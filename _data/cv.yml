        description_list:
        - Scope of work was development of continuous operation equipment for the pilot plant reactor. 
        - Specified upstream and downstream hardware requirements to upgrade pilot plant from batch operation to continuous operation. 
        - Developed conceptual drawings and diagrams, including process flow diagram, detailed conceptual mechanical system layouts, etc. 
        - Specified and procured commercial off the shelf equipment when possible. 
        - Oversaw third party development of specialized mechanical hardware where required. 
         
      - title: Commercial Scale Conceptual Design - Energy Analysis
